# Dumri local-only Supabase stack.
# This file does not link to or modify the hosted Dumri project.
project_id = "dumri-local-test"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

# Local-only fake provider credentials are sufficient for configured test numbers.
[auth.sms.twilio]
enabled = true
account_sid = "local-test-placeholder"
message_service_sid = "local-test-placeholder"
auth_token = "local-test-placeholder"

# Use this synthetic number only against the local stack.
# Anyone with this number/code can authenticate in this disposable local environment.
[auth.sms.test_otp]
66812345678 = "123456"
